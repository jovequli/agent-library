[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-history-library"
version = "0.1.0"
description = "A local-first, human-readable library of agent conversations and portable task handoffs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-2-Clause AND BSD-3-Clause AND Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/agent_library/web/vendor/*.LICENSE*"]
authors = [{name = "Agent Library contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jovequli/agent-library"
Repository = "https://github.com/jovequli/agent-library"
Issues = "https://github.com/jovequli/agent-library/issues"

[project.scripts]
agent-library = "agent_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_library = ["web/*", "web/vendor/*", "web/vendor/fonts/*"]
