name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_vendor.py
      - run: python scripts/check_release.py
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'setuptools>=77'
      - run: python scripts/check_release.py
      - run: python scripts/verify_vendor.py
      - run: python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True); import setuptools.build_meta as b; b.build_sdist('dist')"
      - run: python scripts/check_distribution.py dist/agent_history_library-0.1.0.tar.gz
      - run: python -m pip wheel --no-deps --wheel-dir dist dist/agent_history_library-0.1.0.tar.gz
      - run: python scripts/check_distribution.py dist/agent_history_library-0.1.0-py3-none-any.whl
